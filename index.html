<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ಅಹಿಂದ ಬಡ ಮಕ್ಕಳಿಗೆ ಉಚಿತ ತರಬೇತಿ – IAS, IPS, KAS ಅಧಿಕಾರಿಗಳಾಗುವ ಕನಸು ನನಸು.</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Kannada:wght@400;600;800&display=swap">
<style>
:root{--bg:#f7f1e5;--surface:#fffdf8;--text:#23201b;--muted:#6a6358;--brand:#b4491f;--brand2:#7a2e12;--line:#e6dcc8;--ok:#1d7a4d;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,'Segoe UI','Noto Sans Kannada','Nirmala UI',Roboto,sans-serif;line-height:1.6}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px}
.nav{display:flex;justify-content:space-between;align-items:center;padding:16px 0;gap:10px}
.logo{font-weight:800;font-size:1.2rem;color:var(--brand)}
.navr{display:flex;gap:10px;align-items:center}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.lang button{border:0;background:transparent;padding:7px 13px;font:inherit;font-size:.85rem;font-weight:600;cursor:pointer;color:var(--muted)}
.lang button.on{background:var(--brand);color:#fff}
.btn{display:inline-block;background:var(--brand);color:#fff;border:0;border-radius:10px;padding:13px 26px;font:inherit;font-weight:700;font-size:1rem;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--brand2)}
.nav .btn{padding:8px 16px;font-size:.9rem}
.top{background:#7a2e12;padding:10px 0 10px}
.topin{max-width:1000px;margin:0 auto;padding:0 20px;display:flex;flex-direction:column;align-items:center;gap:10px}
.inst{font-weight:800;font-size:clamp(1rem,3vw,1.4rem);color:#fff3e0;text-align:center;line-height:1.3}
.top .navr{justify-content:center;flex-wrap:wrap}
.banner{display:block;margin:18px 0 6px;background:linear-gradient(180deg,#fdebd9,#fff7ea);border:2px solid var(--brand);border-radius:18px;padding:20px 16px;text-align:center;box-shadow:0 8px 22px rgba(122,46,18,.12)}
.banner span{display:block;font-weight:800;line-height:1.25}
.b1{color:var(--brand2);font-size:clamp(1.4rem,4.5vw,2.4rem)}
.b2{color:var(--brand);font-size:clamp(1.3rem,4vw,2rem);margin:4px 0}
.b3{color:var(--brand2);font-size:clamp(1.4rem,4.4vw,2.3rem);margin:4px 0 10px}
.b4{color:var(--text);font-size:clamp(1rem,3vw,1.35rem);border-top:2px solid rgba(180,73,31,.35);padding-top:10px}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:center;padding:24px 0 36px}
@media (max-width:760px){.hero{grid-template-columns:1fr;text-align:center}.hero .pic{order:-1}}
.badge{display:inline-block;background:#fdebd9;color:var(--brand2);font-weight:700;font-size:.85rem;padding:5px 12px;border-radius:999px;margin-bottom:12px}
.hero h1{font-size:clamp(1.8rem,5vw,2.8rem);line-height:1.2;margin:0 0 14px}
.hero h1 span{color:var(--brand)}
.hero p{color:var(--muted);font-size:1.05rem;margin:0 0 22px}
.pic{display:flex;justify-content:center}
.pic img{width:100%;max-width:380px;height:auto;border-radius:16px;border:1px solid var(--line);box-shadow:0 14px 34px rgba(80,50,20,.18)}
.feats{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin:14px 0 36px}
.feat{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:12px;padding:14px 16px;font-weight:600;color:var(--text);text-decoration:none}
.feat::before{content:"✔";color:var(--ok);font-weight:800}
a.feat:hover{background:#fdebd9}
h2{font-size:1.5rem;margin:30px 0 4px}
.sub{color:var(--muted);margin:0 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin:16px 0 36px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.card h3{margin:0 0 6px;color:var(--brand)}
.card p{margin:0;color:var(--muted);font-size:.95rem}
a.card{display:block;color:inherit;text-decoration:none;cursor:pointer;transition:transform .15s,box-shadow .15s}
a.card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(122,46,18,.15);border-color:var(--brand)}
.go{display:block;margin-top:10px;color:var(--brand2);font-weight:700;font-size:.9rem}
.form{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;margin:16px 0 48px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:600px){.row{grid-template-columns:1fr}}
label{display:block;font-weight:600;font-size:.9rem;margin:12px 0 5px}
input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--text);font:inherit}
input:focus,select:focus{outline:2px solid var(--brand);border-color:transparent}
.err{color:#c0392b;font-size:.85rem;min-height:1.1em;margin-top:3px}
.form .btn{width:100%;margin-top:18px}
.ok{display:none;text-align:center;padding:12px 0}
.ok h3{color:var(--ok);font-size:1.4rem;margin:0 0 8px}
.contact{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin:14px 0 44px}
.contact .card h3{font-size:1rem;margin-bottom:8px}
.contact .card p{color:var(--text);font-size:1.05rem;font-weight:600}
.contact a.tel{color:var(--brand2);text-decoration:none;font-weight:800;font-size:1.15rem}
.wa{display:inline-block;margin-left:8px;background:#1d7a4d;color:#fff;text-decoration:none;border-radius:8px;padding:3px 10px;font-size:.8rem;font-weight:700}
footer{border-top:1px solid var(--line);padding:22px 0;text-align:center;color:var(--muted);font-size:.9rem}
</style>
</head>

  <div class="inst">🪔 <span data-i="inst"></span></div>
  <div class="navr">
    <div class="lang"><button id="l-en" type="button">English</button><button id="l-kn" type="button">ಕನ್ನಡ</button></div>
    <a class="btn" href="#register" data-i="nav"></a>
  </div>
</div></header>
